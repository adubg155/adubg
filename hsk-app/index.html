<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3261e">
  <meta name="description" content="Ôn tập từ vựng HSK 1–4 offline">
  <title>HSK Ôn tập</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="screen-title">Ôn tập</h1>
    <span id="level-chip" class="chip" hidden></span>
  </header>

  <main id="app" class="content" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Điều hướng chính">
    <button data-tab="review" aria-label="Ôn tập">📚<span>Ôn tập</span></button>
    <button data-tab="test" aria-label="Kiểm tra">📝<span>Kiểm tra</span></button>
    <button data-tab="games" aria-label="Trò chơi">🎮<span>Trò chơi</span></button>
    <button data-tab="mistakes" aria-label="Nhật ký sai">❌<span>Sai</span></button>
    <button data-tab="stats" aria-label="Thống kê">📊<span>Thống kê</span></button>
    <button data-tab="settings" aria-label="Cài đặt">⚙️<span>Cài đặt</span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
